  <!-- stored theme, applied before first paint. These pages carry no toggle of
       their own, but must honour a choice made on the check-in flow. -->
  
<script nonce="dGVzdC1ub25jZS0wMDAwMDA=">
  // Safari in private browsing has historically thrown on localStorage rather
  // than returning null, which would abort head parsing.
  try {
    const theme = localStorage.getItem('theme');

    if (theme === 'light' || theme === 'dark') {
      document.documentElement.dataset.theme = theme;
    }
  } catch {}
</script>


  <!-- page-specific styles -->
  <link rel="stylesheet" href="/css/dist/pages/error.css" />
