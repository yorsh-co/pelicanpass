<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PelicanPass</title>

    
  <meta name="theme-color" content="#0e4a5a" />
  

  <!-- favicon -->
  <link rel="icon" type="image/svg+xml" href="/assets/images/icon/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/icon/favicon-32x32.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/assets/images/icon/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials">

    
  <link
    rel="preload"
    as="image"
    href="/assets/images/bg/bg.webp"
    type="image/webp"
    fetchpriority="high"
  />
  

  <!-- global styles -->
  <link rel="stylesheet" href="/css/dist/main.css" />

  <!-- stored theme, applied before first paint. These pages carry no toggle of
       their own, but must honour a choice made on the check-in flow. -->
  
<script nonce="dGVzdC1ub25jZS0wMDAwMDA=">
  // Safari in private browsing has historically thrown on localStorage rather
  // than returning null, which would abort head parsing.
  try {
    const theme = localStorage.getItem('theme');

    if (theme === 'light' || theme === 'dark') {
      document.documentElement.dataset.theme = theme;
    }
  } catch {}
</script>


  <!-- page-specific styles -->
  <link rel="stylesheet" href="/css/dist/pages/landing.css" />

</head>
<body class="plain-page" data-audience="participant">

  <div class="plain-wrapper">
    

<script id="landing-data" type="application/json" nonce="dGVzdC1ub25jZS0wMDAwMDA=">
  {"opensAt":1792260000000,"serverNow":1792247400000,"audience":"participant","fallback":false}
</script>
<script type="application/json" data-i18n="landing" nonce="dGVzdC1ub25jZS0wMDAwMDA=">{"landing.action":[{"type":0,"value":"Faça seu check-in"}],"landing.closed.body":[{"type":0,"value":"Até a próxima!"}],"landing.closed.title":[{"type":0,"value":"Obrigado por participar!"}],"landing.days":[{"type":6,"value":"days","options":{"one":{"value":[{"type":0,"value":"dia"}]},"other":{"value":[{"type":0,"value":"dias"}]}},"offset":0,"pluralType":"cardinal"}],"landing.lede":[{"type":0,"value":"O check-in abre em..."}],"landing.opensAt":[{"type":1,"value":"date"},{"type":0,"value":", às "},{"type":1,"value":"time"}],"landing.reopening":[{"type":0,"value":"O check-in estará disponível em instantes."}],"landing.unit.hours":[{"type":0,"value":"horas"}],"landing.unit.minutes":[{"type":0,"value":"min"}],"landing.unit.seconds":[{"type":0,"value":"seg"}]}</script>


<main class="landing">
  <div class="landing-content">
    <img class="landing-mark" src="/assets/images/logo/mark.svg" alt="" />
    <p class="landing-lede">O check-in abre em...</p>

    
    <!--
    <p class="landing-opens">
      O check-in abre <strong>sábado, 17/10, às 15h00</strong>
    </p>
    -->

    
    <div class="landing-countdown" data-landing="countdown" aria-hidden="true" >
      <p class="landing-days" data-landing="days" hidden>
        <span data-landing="days-value">0</span>
        <span data-landing="days-label">dia</span>
      </p>

      <div class="landing-units">
        
        <div class="landing-unit">
          <span class="landing-digits" data-unit="hours">
            <span class="landing-digit">0</span><span class="landing-digit">3</span>
          </span>
          <span class="landing-unit-label">horas</span>
        </div>
        
        <div class="landing-unit">
          <span class="landing-digits" data-unit="minutes">
            <span class="landing-digit">3</span><span class="landing-digit">0</span>
          </span>
          <span class="landing-unit-label">min</span>
        </div>
        
        <div class="landing-unit">
          <span class="landing-digits" data-unit="seconds">
            <span class="landing-digit">0</span><span class="landing-digit">0</span>
          </span>
          <span class="landing-unit-label">seg</span>
        </div>
        
      </div>
    </div>

    
    

    
    <a
      class="landing-action"
      data-landing="action"
      href="/checkin"
      hidden
    >
      Faça seu check-in
    </a>
  </div>

  
  <img
    class="boot-lettering"
    src="/assets/images/logo/wordmark-two-tone.svg"
    alt="PelicanPass"
  />
</main>



    <footer>
  <div class="footer-top small-print">
    <span>© 2026 PelicanPass</span>
    <span class="dot">•</span>
    <span class="credit">
      por
      <a href="https://github.com/yorsh-co/pelicanpass" target="_blank">Yorsh</a>
    </span>
  </div>

  <div class="footer-links small-print">
    <a href="/privacy">Privacidade</a>
    <span class="dot">•</span>
    <a href="/terms">Termos</a>
    
    
    <span class="dot">•</span>
    <!--
      The icon and the label name the theme the tap will switch *to*, not the
      one in effect. `client/theme/theme.ts` rewrites both on load from the
      two data labels, so the aria-label here is only what a light-themed first
      paint happens to need.
    -->
    <button
      class="theme-toggle"
      data-theme-toggle
      type="button"
      aria-label="Ativar tema escuro"
      data-label-dark="Ativar tema escuro"
      data-label-light="Ativar tema claro"
    >
      <span class="material-symbols-outlined" aria-hidden="true">dark_mode</span>
    </button>
        
    
    <span class="footer-locales-wrap">
      <span class="dot">•</span>
      <details class="footer-locales" aria-label="Idiomas">
        <summary lang="pt-BR">
          BR<span class="visually-hidden"> português (Brasil)</span>
          <span class="material-symbols-outlined" aria-hidden="true">keyboard_arrow_down</span>
        </summary>
        <ul class="footer-locales-menu">
          
          <li>
            <a
              href="/landing?lang=pt-BR"
              hreflang="pt-BR"
              lang="pt-BR"
              aria-current="true"
            >
              <span class="footer-locales-code">BR</span>
              <span class="footer-locales-name">português (Brasil)</span>
              
              <span class="material-symbols-outlined" aria-hidden="true">check</span>
              
            </a>
          </li>
          
          <li>
            <a
              href="/landing?lang=en"
              hreflang="en"
              lang="en"
              
            >
              <span class="footer-locales-code">EN</span>
              <span class="footer-locales-name">English</span>
              
            </a>
          </li>
          
          <li>
            <a
              href="/landing?lang=en-XA"
              hreflang="en-XA"
              lang="en-XA"
              
            >
              <span class="footer-locales-code">XA</span>
              <span class="footer-locales-name">English (Pseudo-Accents)</span>
              
            </a>
          </li>
          
        </ul>
      </details>
    </span>
    
  </div>
</footer>

  </div>

  <!-- global scripts. The only script these pages load: the footer's theme
       toggle would otherwise render here and do nothing. -->
  <script type="module" src="/js/theme/theme.js"></script>

  <!-- page-specific scripts -->
  <script type="module" src="/js/pages/landing/index.js"></script>

</body>
</html>
