# Load-test stack: the production app, database and cache, with no edge.
#
# A separate project beside the event stack, never in place of it. Each service
# extends its compose.prod.yml definition, so the image, Postgres tuning, pool,
# read-only root and log caps are the ones the event runs on; only names,
# networks, volumes and the switches below differ. There is no tunnel, proxy or
# Tailscale sidecar: k6 reaches app:3000 directly, which is why it can set
# X-Forwarded-For (`trust proxy 1`) and why Cloudflare's challenge is out of the
# way. Procedure: docs/performance/load-testing.md.
#
#   docker compose -f compose.loadtest.yml up -d --build
#   docker compose -f compose.loadtest.yml --profile tools run --rm --build migrate
#   docker compose -f compose.loadtest.yml --profile tools run --rm k6 run -e PHASE=raffle run.ts
#   docker compose -f compose.loadtest.yml down -v

name: pelicanpass-loadtest

services:
  app:
    extends:
      file: compose.prod.yml
      service: app
    container_name: pelicanpass-loadtest-app
    depends_on:
      - db
      - cache
    # Over the shared .env. Nothing here may page the team or message a real
    # phone, and every gate a script cannot pass is opened.
    environment:
      ALERT_ENABLED: 'false'
      # k6 posts to app:3000 and names it in `Origin`, which the same-origin
      # check requires to match.
      APP_URL: http://app:3000
      DISCORD_WEBHOOK_URL: ''
      DISCORD_WEBHOOK_URL_CRITICAL: ''
      WHATSAPP_ENABLED: 'false'
      WHATSAPP_WEBHOOK_ENABLED: 'false'
      LANDING_ENABLED: 'false'
      # Cloudflare's always-pass test pair. A flagged session still has to
      # present a token, so a captcha gate shows up as a counted failure.
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
      SURVEY_PARTICIPANT_ENABLED: 'true'
      SURVEY_OPENS_AT: '2000-01-01T00:00:00Z'
      SURVEY_CLOSES_AT: ''
      # The closed-event gate ignores LANDING_ENABLED, so a closing time already
      # past in the shared .env would refuse every attendee request.
      EVENT_CLOSES_AT: ''
      # The variables under test, set per run from the shell.
      TRUSTED_IPS: ${LOADTEST_TRUSTED_IPS:-}
      RATE_LIMIT_OVERRIDES: ${LOADTEST_RATE_LIMIT_OVERRIDES:-}
      # Unset means the code's default, not the event .env's: env.ts reads an
      # empty value as absent. The defaults are what a tuning run measures.
      LOAD_SHED_ENABLED: ${LOADTEST_LOAD_SHED_ENABLED:-}
      LOAD_SHED_MAX_LAG_MS: ${LOADTEST_LOAD_SHED_MAX_LAG_MS:-}
      LOAD_SHED_MAX_POOL_WAITING: ${LOADTEST_LOAD_SHED_MAX_POOL_WAITING:-}

  migrate:
    extends:
      file: compose.prod.yml
      service: migrate
    container_name: pelicanpass-loadtest-migrate
    depends_on:
      - db

  cache:
    extends:
      file: compose.prod.yml
      service: cache
    container_name: pelicanpass-loadtest-cache

  db:
    extends:
      file: compose.prod.yml
      service: db
    container_name: pelicanpass-loadtest-db

  k6:
    image: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
    profiles:
      - tools
    networks:
      - web
    working_dir: /loadtest
    volumes:
      - ./loadtest:/loadtest:ro
      - ./loadtest/results:/results
    environment:
      BASE_URL: http://app:3000
      CHECKIN_QR_TOKEN: ${CHECKIN_QR_TOKEN:?the venue QR token - see .env.example}

# Unpinned bridge names and subnets, so this project cannot collide with the
# event stack's br-pp* bridges or its edge range.
networks:
  web:
  app-egress:
  data:
    internal: true

volumes:
  cache:
  data:
  logs:
